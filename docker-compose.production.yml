services:
  app_production:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env.production
    environment:
      DB_HOST: db_production
      DB_PORT: 3306
    depends_on:
      db_production:
        condition: service_healthy
    volumes:
      - storage_production:/var/www/html/storage
    restart: unless-stopped
    networks:
      default:
        aliases:
          - app

  nginx_production:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_production:/var/www/html/storage:ro
    depends_on:
      - app_production
    restart: unless-stopped

  db_production:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_production_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  db_production_data:
    name: kawalbelajar_db_production_data
  storage_production:
    name: kawalbelajar_storage_production
