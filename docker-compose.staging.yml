services:
  app_staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    env_file:
      - .env.staging
    environment:
      DB_HOST: db_staging
      DB_PORT: 3306
    depends_on:
      db_staging:
        condition: service_healthy
    volumes:
      - storage_staging:/var/www/html/storage
    restart: unless-stopped
    networks:
      default:
        aliases:
          - app

  nginx_staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_staging:/var/www/html/storage:ro
    depends_on:
      - app_staging
    restart: unless-stopped

  db_staging:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.staging}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.staging}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.staging}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  db_staging_data:
    name: kawalbelajar_db_staging_data
  storage_staging:
    name: kawalbelajar_storage_staging
